<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <title>Positioning дасгал - Badge, Navbar, Overlay</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background-color: #f5f5f5;
            padding-top: 51px;
        }

        .navbar {
            background-color: #1e293b;
            color: #ffffff;
            padding: 16px 24px;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .section-title {
            background-color: #e2e8f0;
            padding: 12px 24px;
            margin: 0;
            position: sticky;
            top: 51px;
            z-index: 10;
        }

        .card-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 24px;
        }

        .card {
            flex: 1;
            min-width: 200px;
            background-color: #ffffff;
            padding: 16px;
            border-radius: 8px;
            position: relative;
        }

        .badge {
            font-size: 12px;
            font-weight: bold;
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: #dc2626;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 12px;
            z-index: 1;
        }

        .screenshot {
            height: 180px;
            border-radius: 8px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            margin-top: 12px;
            position: relative;
            overflow: hidden;
        }

        .overlay {
            font-size: 14px;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            padding: 8px 12px;
        }

        .filler {
            height: 600px;
            padding: 24px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <nav class="navbar">GameShop — Тэргүүлэгчид</nav>

    <h2 class="section-title">Шинэ тоглоомууд</h2>

    <div class="card-row">
        <div class="card">
            <span class="badge">ШИНЭ</span>
            <h3>Могой</h3>
            <p>Сонгодог могой тоглоом.</p>
            <div class="screenshot">
                <div class="overlay">Дээд оноо: 9800 — Бат-Эрдэнэ</div>
            </div>
        </div>
        <div class="card">
            <span class="badge">-50%</span>
            <h3>Сансрын буудлага</h3>
            <p>Галактикаа хамгаал.</p>
            <div class="screenshot">
                <div class="overlay">Дээд оноо: 8700 — Сарнай</div>
            </div>
        </div>
    </div>

    <div class="filler">
        Доош скролл хийж navbar тогтмол, гарчиг наалдамхай эсэхийг шалгаарай.
    </div>

</body>

</html>
