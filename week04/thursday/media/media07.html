<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query 07</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 16px;
        }

        .box {
            background-color: #3498db;
            color: #ffffff;
            padding: 24px;
            margin-bottom: 8px;
            text-align: center;
        }

        @media (orientation: landscape) {
            .row {
                display: flex;
                gap: 8px;
            }

            .box {
                flex: 1;
                margin-bottom: 0;
            }
        }
    </style>
</head>

<body>
    <h1>Media Query 07</h1>
    <div class="row">
        <div class="box">Portrait: stacked</div>
        <div class="box">Landscape: side by side</div>
    </div>
</body>

</html>
