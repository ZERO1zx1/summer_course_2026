<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generative Art Studio</title>
  <script src="./js/p5.js"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <h1>Generative Art Studio</h1>

  <div class="controls">
    <div class="control">
      <label for="countInput">Particle Count: <span id="countValue">15</span></label>
      <input type="range" id="countInput" min="5" max="50" value="15">
    </div>

    <div class="control">
      <label for="speedInput">Speed: <span id="speedValue">1.5</span></label>
      <input type="range" id="speedInput" min="0.5" max="3" step="0.1" value="1.5">
    </div>

    <div class="control">
      <label for="shapeSelect">Shape:</label>
      <select id="shapeSelect">
        <option value="circle">Circle</option>
        <option value="square">Square</option>
        <option value="triangle">Triangle</option>
      </select>
    </div>

    <div class="control">
      <label for="bgInput">Background:</label>
      <input type="color" id="bgInput" value="#0a0a1a">
    </div>

    <div class="control">
      <label>Palette:</label>
      <input type="color" id="color1" value="#00ff88">
      <input type="color" id="color2" value="#00ccff">
      <input type="color" id="color3" value="#ff00ff">
    </div>

    <div class="control">
      <button id="rebuildBtn">Rebuild Scene</button>
      <button id="saveBtn">Save Screenshot</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script src="./js/script.js"></script>
</body>
</html>
