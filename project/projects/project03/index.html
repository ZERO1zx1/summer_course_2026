<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <section class="profile-card">
        <div class="profile-header">
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
            <img src="./image/profile.png" alt="profile picture" class="profile-img">
        </div>

        <div class="profile-body">
            <h1 class="profile-name">Light</h1>
            <h3 class="profile-username">@light_devs01</h3>
            <p class="profile-bio">Frontend Developer, Discord bot developer, i use HTML, CSS, JavaScript, and Python to create engaging user experiences.</p>
            <p class="profile-action">Follow</p>
            <p class="profile-action">Message</p>
        </div>
    </section>
    <script src="./js/script.js"></script>
</body>
</html>
