<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Үнийн санал - Pricing Table</title>
    <link rel="stylesheet" href="./css/style1.css">
</head>
<body>

    <div class="pricing-container">
        
        <div class="card basic">
            <h2>Basic</h2>
            <div class="price">$9<span>/сар</span></div>
            <ul>
                <li>1 төсөл холбох</li>
                <li>5GB Багтаамж</li>
                <li>Имэйл дэмжлэг</li>
                <li class="disabled">Дээд зэргийн хурд</li>
            </ul>
            <button class="btn">Сонгох</button>
        </div>

        <div class="card pro">
            <div class="badge">Онцлох</div>
            <h2>Pro</h2>
            <div class="price">$29<span>/сар</span></div>
            <ul>
                <li>5 төсөл холбох</li>
                <li>50GB Багтаамж</li>
                <li>24/7 Шууд чат дэмжлэг</li>
                <li>Дээд зэргийн хурд</li>
            </ul>
            <button class="btn btn-pro">Сонгох</button>
        </div>

        <div class="card premium">
            <h2>Premium</h2>
            <div class="price">$99<span>/сар</span></div>
            <ul>
                <li>Хязгааргүй төсөл</li>
                <li>500GB Багтаамж</li>
                <li>Тусгай менежер</li>
                <li>Дээд зэргийн хурд</li>
            </ul>
            <button class="btn">Сонгох</button>
        </div>

    </div>

</body>
</html>
