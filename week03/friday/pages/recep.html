<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevStarter - Profile Card</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <img src="../images/logo.png" alt="DevStarter Logo" class="logo-img">
            <span>DevStarter</span>
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="https://github.com/ZERO1zx1">Project</a></li>
        </ul>
    </nav>

    <main class="hero-section">
        <div class="profile-card">
            <img src="../images/logo.png" alt="Profile Image" class="profile-image">
            <div class="profile-info">
                <h1>Hello, I'm a Light</h1>
                <p>Flexbox-ийн ид шидэд суралцаж буй урам зоригтой frontend хөгжүүлэгч байна.</p>
                <button class="action-btn"><a href="https://github.com/ZERO1zx1">Миний project</a></button>
            </div>
        </div>
    </main>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="100%" height="100%">
        <rect width="400" height="150" fill="#1e1e2f" rx="15" />

        <g transform="translate(40, 35)" fill="none" stroke="#fca311" stroke-width="4" stroke-linecap="round"
            stroke-linejoin="round">
            <path
                d="M40 10 C20 10, 10 30, 20 50 C25 60, 30 65, 30 75 L50 75 C50 65, 55 60, 60 50 C70 30, 60 10, 40 10 Z" />
            <path d="M30 85 L50 85" />
            <path d="M35 95 L45 95" />

            <path d="M32 35 L25 42 L32 49" stroke="#00b4d8" stroke-width="3" />
            <path d="M48 35 L55 42 L48 49" stroke="#00b4d8" stroke-width="3" />
        </g>

        <text x="130" y="75" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff">
            Light <tspan fill="#fca311">Devs</tspan>
        </text>

        <text x="135" y="105" font-family="Courier New, monospace" font-size="16" fill="#00b4d8" letter-spacing="2">
            <tspan fill="#ffffff">&lt;</tspan>Vobecoding <tspan fill="#ffffff">/&gt;</tspan>
        </text>
    </svg>

    <footer class="site-footer">
        <p>&copy; 2026 DevStarter. All rights reserved.</p>
    </footer>
</body>

</html>
